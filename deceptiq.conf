# C:\nginx\conf\deceptiq.conf   (Windows version, the one to use on your PC)
# Loaded by ONE line inside the http { } block of nginx.conf:   include deceptiq.conf;
# DeceptIQ: ONE Nginx reverse proxy in front of the real site and the Flask honeypot.
#
# Ports (confirm with teammates):
#   Nginx 8080 | Decision engine 9000 | Flask honeypot 5000 | Real website 8000
#
# This file is included inside the http {} block, so
# log_format / upstream / server are valid here. Do NOT define them again in nginx.conf.

log_format deceptiq escape=json
    '{"timestamp":"$time_iso8601",'
    '"client_ip":"$remote_addr",'
    '"destination_ip":"$server_addr",'
    '"destination_port":$server_port,'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"route":"$route"}';

upstream real_site { server 127.0.0.1:8000; }
upstream honeypot  { server 127.0.0.1:5000; }
upstream engine    { server 127.0.0.1:9000; }

server {
    listen 8080;
    server_name _;

    access_log logs/deceptiq.jsonl deceptiq;

    set $route real;      # becomes "honeypot" when traffic is diverted

    # Internal check against the Decision Engine: 200 = normal, 403 = divert
    location = /_check {
        internal;
        proxy_pass http://engine/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Client-IP       $remote_addr;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-Host   $host;
        proxy_connect_timeout 300ms;
        proxy_read_timeout    500ms;

        # Engine down / slow / erroring => FAIL OPEN (serve the real site)
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @engine_unavailable;
    }
    location @engine_unavailable { return 200; }

    # Keep the honeypot control plane private
    location ^~ /_hp/ { return 404; }

    # Everything else: check, then route
    location / {
        auth_request /_check;
        error_page 403 = @honeypot;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_pass http://real_site;
    }

    location @honeypot {
        set $route honeypot;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_pass http://honeypot;
    }
}