# C:\nginx\conf\deceptiq.conf  (Windows version; loaded via "include deceptiq.conf;" in nginx.conf http block)
# DeceptIQ: ONE Nginx reverse proxy in front of the real site and the Flask honeypot.
#
# Ports (confirm with teammates):
#   Nginx 8080 | Decision engine 9000 | Flask honeypot 5000 | Real website 8000
#
# This file is included inside the http {} block (conf.d/*.conf), so
# log_format / upstream / map are valid here.
# Needs the auth_request module:  nginx -V 2>&1 | grep -o http_auth_request_module

# ---- 1. JSONL access log (the detector reads this) -----------------------
# The 6 fields from the architecture guide + "route" so the detector can ignore
# honeypot traffic (guide: "prevent honeypot traffic from repeatedly triggering
# ordinary website alerts"). Tell the detector teammate about the extra field.
log_format deceptiq escape=json
    '{"timestamp":"$time_iso8601",'
    '"client_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"route":"$route"}';

# ---- 2. Backends ----------------------------------------------------------
upstream real_site { server 127.0.0.1:8000; }
upstream honeypot  { server 127.0.0.1:5000; }
upstream engine    { server 127.0.0.1:9000; }   # change to the teammate's IP if on another machine

server {
    listen 8080;
    server_name _;

    access_log logs/deceptiq.jsonl deceptiq;

    set $route real;      # becomes "honeypot" when traffic is diverted

    # ---- 3. Internal check against the Decision Engine -------------------
    # Engine contract:  GET /check  ->  200 = normal, 403 = divert to honeypot
    location = /_check {
        internal;                                   # unreachable from outside
        proxy_pass http://engine/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Trusted identity headers. We set them ourselves; clients cannot forge them.
        proxy_set_header X-Client-IP       $remote_addr;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-Host   $host;
        proxy_connect_timeout 300ms;
        proxy_read_timeout    500ms;

        # Engine down / slow / erroring => FAIL OPEN (serve the real site)
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @engine_unavailable;
    }
    location @engine_unavailable { return 200; }

    # ---- 4. Keep the honeypot control plane private -----------------------
    location ^~ /_hp/ { return 404; }

    # ---- 5. Everything else: check, then route ----------------------------
    location / {
        auth_request /_check;
        # Only nginx-generated 403s (from auth_request) are diverted. A 403 coming
        # from the real site is NOT intercepted (proxy_intercept_errors is off here).
        error_page 403 = @honeypot;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite, never append
        proxy_pass http://real_site;
    }

    location @honeypot {
        set $route honeypot;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_pass http://honeypot;      # original URI is preserved
    }
}
